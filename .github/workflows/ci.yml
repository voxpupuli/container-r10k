---
# Managed by modulesync - DO NOT EDIT
# https://voxpupuli.org/docs/updating-files-managed-with-modulesync/

name: 🚦 CI

# yamllint disable-line rule:truthy
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
  merge_group:
    branches:
      - main

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  setup-matrix:
    name: Set up build matrix
    runs-on: ubuntu-latest
    outputs:
      build-matrix: ${{ steps.build-matrix.outputs.build-matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate build matrix
        id: build-matrix
        run: echo "build-matrix=$(jq -c . build_versions.json)" >> "$GITHUB_OUTPUT"

  general-ci:
    name: General CI
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: voxpupuli/crafty/.github/workflows/general_ci.yaml@main
    with:
      shellcheck_scan_dir: '.'

  build-container:
    name: Build ci container
    runs-on: ubuntu-latest
    needs:
      - setup-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup-matrix.outputs.build-matrix) }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Containerfile
          tags: 'ci/r10k:${{ matrix.rubygem_r10k }}'
          push: false
          build-args: |
            RUBYGEM_R10K=${{ matrix.rubygem_r10k }}
            RUBYGEM_OPENVOX=${{ matrix.rubygem_openvox }}

      - name: Test image
        run: |
          docker run --rm ci/r10k:${{ matrix.rubygem_r10k }} deploy environment -mv
          ./tests/podman_ssh_deploy.sh ci/r10k:${{ matrix.rubygem_r10k }}

  tests:
    name: Test suite
    if: always()
    needs:
      - setup-matrix
      - general-ci
      - build-container
    runs-on: ubuntu-24.04
    steps:
      - name: Verify required jobs
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
